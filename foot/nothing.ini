# EverythingOS terminal: same card colour, font and padding as the shell.
[main]
shell=/usr/bin/fish
font=GoogleSansCode Nerd Font Mono:weight=light:size=14
font-bold=GoogleSansCode Nerd Font Mono:weight=regular:size=14
bold-text-in-bright=no
pad=20x14 center
app-id=everythingos-term
title=EverythingOS
selection-target=clipboard

[cursor]
style=beam
beam-thickness=1
blink=yes
blink-rate=600

[csd]
preferred=none

[scrollback]
lines=10000
indicator-position=none

[mouse]
hide-when-typing=yes

[colors-dark]
alpha=1.0
background=0f0f0f
foreground=ffffff
selection-background=ffffff
selection-foreground=0f0f0f
regular0=0f0f0f
regular1=D71921
regular2=9be3a0
regular3=f2d47a
regular4=8fb4ff
regular5=c9a6ff
regular6=8fe0e0
regular7=d9d9d9
bright0=555555
bright1=ff3b43
bright2=b5f0b9
bright3=f8e29c
bright4=adc8ff
bright5=dac2ff
bright6=aeeeee
bright7=ffffff
