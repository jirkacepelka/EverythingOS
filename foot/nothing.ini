# Nothing-style terminal: pure black, white text, one red accent, dot cursor.
# Launched by Super+T through a standalone foot (own config, own app-id).
[main]
shell=/usr/bin/fish
font=GoogleSansCode Nerd Font Mono:size=14
pad=28x22 center
app-id=everythingos-term
title=EverythingOS
selection-target=clipboard

[cursor]
style=block
blink=yes
blink-rate=700

[csd]
preferred=none

[scrollback]
lines=10000
indicator-position=none

[mouse]
hide-when-typing=yes

[colors-dark]
alpha=1.0
background=000000
foreground=e6e6e6
cursor=000000 D71921
selection-background=D71921
selection-foreground=ffffff
regular0=000000
regular1=D71921
regular2=b8b8b8
regular3=d9d9d9
regular4=9a9a9a
regular5=c4c4c4
regular6=a8a8a8
regular7=e6e6e6
bright0=555555
bright1=ff3b43
bright2=dcdcdc
bright3=f0f0f0
bright4=bdbdbd
bright5=e0e0e0
bright6=cfcfcf
bright7=ffffff
