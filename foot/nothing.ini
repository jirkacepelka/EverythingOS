# EverythingOS terminal: same card colour, font and padding as the shell.
[main]
shell=/usr/bin/fish
font=GoogleSansCode Nerd Font Mono:size=14
pad=30x24 center
app-id=everythingos-term
title=EverythingOS
selection-target=clipboard

[cursor]
style=beam
beam-thickness=1
blink=yes
blink-rate=600

[csd]
preferred=none

[scrollback]
lines=10000
indicator-position=none

[mouse]
hide-when-typing=yes

[colors-dark]
alpha=1.0
background=171717
foreground=ffffff
selection-background=ffffff
selection-foreground=171717
regular0=171717
regular1=ff6b6b
regular2=9be3a0
regular3=f2d47a
regular4=8fb4ff
regular5=c9a6ff
regular6=8fe0e0
regular7=d9d9d9
bright0=555555
bright1=ff8a8a
bright2=b5f0b9
bright3=f8e29c
bright4=adc8ff
bright5=dac2ff
bright6=aeeeee
bright7=ffffff
