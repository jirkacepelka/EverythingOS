add_newline = true
format = "$directory$git_branch$git_status$cmd_duration\n$character"

[directory]
style = "bold #ffffff"
truncation_length = 0
truncate_to_repo = false
format = "[ ](#8a8a8a)[$path]($style) "

[git_branch]
symbol = " "
style = "#8a8a8a"
format = "[$symbol$branch]($style) "

[git_status]
style = "#D71921"
format = "[$all_status$ahead_behind]($style) "

[cmd_duration]
min_time = 1500
style = "#8a8a8a"
format = "[ $duration]($style)"

[character]
success_symbol = "[●](#D71921) "
error_symbol = "[●](#6a6a6a) "
format = "$symbol"
