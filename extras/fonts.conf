<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!-- Used only by everythingos-shell.service (FONTCONFIG_FILE): any text without an explicit
     font falls back to the same family as the rest of the UI instead of the system default. -->
<fontconfig>
  <include ignore_missing="yes">/etc/fonts/fonts.conf</include>
  <match target="pattern">
    <test name="family" qual="any"><string>sans-serif</string></test>
    <edit name="family" mode="assign_replace" binding="strong"><string>GoogleSansCode Nerd Font Propo</string></edit>
  </match>
  <match target="pattern">
    <test name="family" qual="any"><string>Sans Serif</string></test>
    <edit name="family" mode="assign_replace" binding="strong"><string>GoogleSansCode Nerd Font Propo</string></edit>
  </match>
  <match target="pattern">
    <test name="family" qual="any"><string>Noto Sans</string></test>
    <edit name="family" mode="assign_replace" binding="strong"><string>GoogleSansCode Nerd Font Propo</string></edit>
  </match>
  <match target="pattern">
    <test name="family" qual="any"><string>Google Sans</string></test>
    <edit name="family" mode="assign_replace" binding="strong"><string>GoogleSansCode Nerd Font Propo</string></edit>
  </match>
</fontconfig>
